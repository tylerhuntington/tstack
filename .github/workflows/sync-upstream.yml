name: Sync upstream gstack

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      UPSTREAM_REPO: https://github.com/garrytan/gstack.git
      SYNC_BRANCH: chore/sync-upstream

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream main --prune

      - name: Stop if already current
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "tstack already contains upstream/main."
            exit 0
          fi

      - name: Merge upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$SYNC_BRANCH"
          git merge --no-edit upstream/main

      - name: Validate merged branch
        run: |
          bun install --frozen-lockfile
          bun run build
          bun test design/test/auth.test.ts

      - name: Push sync branch
        run: git push --force-with-lease origin HEAD:"$SYNC_BRANCH"

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view "$SYNC_BRANCH" --json number --jq .number >/dev/null 2>&1; then
            echo "Existing upstream sync PR updated."
          else
            gh pr create \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "chore: sync upstream gstack" \
              --body "Automated weekly sync from garrytan/gstack main into tstack. CI validates the build and the TStack OpenAI-compatible designer auth patch."
          fi
